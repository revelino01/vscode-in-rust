[workspace]

[package]
name = "phase9-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["desktop"]
desktop = [
    "rustcode-app/desktop",
    "rustcode-workbench/desktop",
    "rustcode-editor/desktop",
    "rustcode-platform/desktop",
    "dep:winit",
]

[dependencies]
rustcode-app = { path = "../../crates/rustcode-app" }
rustcode-workbench = { path = "../../crates/rustcode-workbench" }
rustcode-editor = { path = "../../crates/rustcode-editor" }
rustcode-ext-host = { path = "../../crates/rustcode-ext-host" }
rustcode-platform = { path = "../../crates/rustcode-platform" }
rustcode-base = { path = "../../crates/rustcode-base" }
rustcode-terminal = { path = "../../crates/rustcode-terminal" }
rustcode-protocols = { path = "../../crates/rustcode-protocols" }
encoding_rs = "0.8"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
winit = { version = "0.30", optional = true }
