[package]
name = "rustcode-platform"
version = "0.1.0"
edition = "2021"

[features]
default = []
gpui = []

[dependencies]
rustcode-base = { path = "../rustcode-base" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "fs", "io-util", "time", "macros", "rt"] }
notify = { version = "7", default-features = false }
uuid = { version = "1", features = ["v4"] }



