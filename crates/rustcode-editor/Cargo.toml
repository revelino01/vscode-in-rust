[package]
name = "rustcode-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
rustcode-base = { path = "../rustcode-base" }
rustcode-platform = { path = "../rustcode-platform" }
parking_lot = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }


