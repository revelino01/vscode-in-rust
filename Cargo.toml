[workspace]
resolver = "2"
members = [
    "crates/rustcode-base",
    "crates/rustcode-platform",
    "crates/rustcode-editor",
    "crates/rustcode-terminal",
    "crates/rustcode-protocols",
    "crates/rustcode-ext-host",
    "crates/rustcode-workbench",
    "crates/rustcode-app",
]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
