[package]
name = "rustcode-app"
version = "0.1.0"
edition = "2021"
description = "RustCode desktop editor application and GPUI bootstrap"
authors = ["RustCode Contributors"]
license = "MIT"
repository = "https://github.com/revelino01/vscode-in-rust"
default-run = "rustcode"

[[bin]]
name = "rustcode"
path = "src/main.rs"

[features]
default = []
gpui = ["rustcode-workbench/gpui", "rustcode-platform/gpui"]

[dependencies]
rustcode-base = { path = "../rustcode-base" }
rustcode-platform = { path = "../rustcode-platform" }
rustcode-editor = { path = "../rustcode-editor" }
rustcode-terminal = { path = "../rustcode-terminal" }
rustcode-protocols = { path = "../rustcode-protocols" }
rustcode-ext-host = { path = "../rustcode-ext-host" }
rustcode-workbench = { path = "../rustcode-workbench" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[[bench]]
name = "startup_time"
harness = false

[[bench]]
name = "memory_footprint"
harness = false


