[package]
name = "rustcode-ext-host"
version = "0.1.0"
edition = "2021"

[dependencies]
rustcode-base = { path = "../rustcode-base" }
rustcode-platform = { path = "../rustcode-platform" }
rustcode-protocols = { path = "../rustcode-protocols" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
parking_lot = "0.12"
thiserror = "2"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
rustcode-editor = { path = "../rustcode-editor" }
rustcode-workbench = { path = "../rustcode-workbench" }


