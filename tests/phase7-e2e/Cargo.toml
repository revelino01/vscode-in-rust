[workspace]

[package]
name = "phase7-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rustcode-app = { path = "../../crates/rustcode-app" }
rustcode-workbench = { path = "../../crates/rustcode-workbench" }
rustcode-editor = { path = "../../crates/rustcode-editor" }
rustcode-ext-host = { path = "../../crates/rustcode-ext-host" }
rustcode-platform = { path = "../../crates/rustcode-platform" }
rustcode-base = { path = "../../crates/rustcode-base" }
rustcode-terminal = { path = "../../crates/rustcode-terminal" }
rustcode-protocols = { path = "../../crates/rustcode-protocols" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
