name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build, Test & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libasound2-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            xvfb

      - name: Setup Rust toolchain (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Setup Rust toolchain (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run workspace tests (default headless)
        run: cargo test -j 2 --workspace

      - name: Run workspace tests (--features desktop, Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -j 2 --workspace --features desktop

      - name: Run workspace tests (--features desktop, Windows)
        if: runner.os == 'Windows'
        run: cargo test -j 2 --workspace --features desktop

      - name: Run extension host compatibility suite
        run: cargo test -j 2 -p rustcode-ext-host --test compat_suite

      - name: Run Node.js extension host tests
        run: node ext-host-js/test.js

      - name: Run Phase 7 E2E syntax checks
        run: node tests/phase7-e2e/runner.js --syntax-check

      - name: Run Phase 7 E2E suite (all tiers)
        run: node tests/phase7-e2e/runner.js --tier all

      - name: Run Phase 8 E2E syntax checks
        run: node tests/phase8-e2e/runner.js --syntax-check

      - name: Run Phase 8 E2E suite (all tiers)
        run: node tests/phase8-e2e/runner.js --tier all

      - name: Run Phase 9 E2E syntax checks
        run: node tests/phase9-e2e/runner.js --syntax-check

      - name: Run Phase 9 E2E suite (all tiers)
        run: node tests/phase9-e2e/runner.js --tier all

      - name: Run Clippy (default features)
        run: cargo clippy -j 2 --workspace --all-targets -- -D warnings

      - name: Run Clippy (--features desktop)
        run: cargo clippy -j 2 --workspace --all-targets --features desktop -- -D warnings

      - name: Run Clippy Linux cross-target check (Windows)
        if: runner.os == 'Windows'
        run: cargo clippy -j 2 --target x86_64-unknown-linux-gnu --workspace --all-targets -- -D warnings

      - name: Compile benchmarks
        run: cargo bench --workspace --no-run -j 2

      - name: Package release bundle & verify artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -File scripts/package.ps1 -Build -Jobs 2
          $zip = Get-ChildItem -Path dist -Filter "rustcode-*-windows-*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Expected Windows distribution zip in dist/" }
          Write-Host "Verified package artifact: $($zip.FullName) ($($zip.Length) bytes)"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entries = $archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
            if (-not ($entries | Where-Object { $_ -like '*/bin/rustcode.exe' })) { throw "Missing bin/rustcode.exe in archive" }
            if (-not ($entries | Where-Object { $_ -like '*/resources/*' })) { throw "Missing resources/ in archive" }
            if (-not ($entries | Where-Object { $_ -like '*/ext-host-js/*' })) { throw "Missing ext-host-js/ in archive" }
          } finally {
            $archive.Dispose()
          }

      - name: Package release bundle & verify artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/package.sh --build --jobs 2
          tarball="$(find dist -maxdepth 1 -name 'rustcode-*-linux-*.tar.gz' | head -n 1)"
          if [ -z "${tarball}" ]; then
            echo "Expected Linux distribution tarball in dist/" >&2
            exit 1
          fi
          echo "Verified package artifact: ${tarball}"
          contents="$(tar -tzf "${tarball}")"
          echo "${contents}" | grep -q '/bin/rustcode$'
          echo "${contents}" | grep -q '/resources/'
          echo "${contents}" | grep -q '/ext-host-js/'
          echo "${contents}" | grep -q '/share/applications/rustcode\.desktop$'
